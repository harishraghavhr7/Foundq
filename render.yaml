services:
  - type: web
    name: venturemind-backend
    env: python
    region: oregon
    plan: free
    rootDir: venturemind/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: venturemind-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "https://localhost:5173"
      - key: LLM_PROVIDER
        value: "auto"
      - key: LLM_FALLBACK_ORDER
        value: "openrouter,gemini,groq,ollama"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false

databases:
  - name: venturemind-db
    plan: free
    databaseName: venturemind
    user: venturemind
